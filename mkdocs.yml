site_name: tps-test
site_description: Measure one model across many providers and gateways
repo_url: https://github.com/teal-sea/tps-test
edit_uri: edit/main/docs/

theme:
  name: readthedocs
  navigation_depth: 2

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - CLI reference: cli.md
  - Configuration: configuration.md
  - Metrics: metrics.md
  - Methodology: methodology.md
  - Gateways: gateways.md
  - Fingerprinting: fingerprinting.md
  - Automation: automation.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
