[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tps-test"
version = "0.1.0"
description = "Measure one model across many providers and gateways: TTFT, inter-token latency, throughput, cost, and whether they serve the same weights."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llm", "benchmark", "throughput", "latency", "providers", "gateways"]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
http2 = ["h2>=4"]
dev = ["ruff>=0.6"]
docs = ["mkdocs>=1.6"]

[project.scripts]
tps = "tps.cli:main"

[tool.setuptools]
packages = ["tps"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
