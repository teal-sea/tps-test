# generated by: tps discover deepseek/deepseek-v4.1-flash
# each target pins ONE upstream: allow_fallbacks = false means a
# failure shows up as an error row instead of silently rerouting.

[run]
reps = 7
concurrency = [1, 4]
prompts = ["prose-256", "code-256"]

[[targets]]
name = "OpenInference (fp4)"
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-v4.1-flash"
api_key_env = "OPENROUTER_API_KEY"
extra_body.provider = { only = ["open-inference/fp4"], allow_fallbacks = false, quantizations = ["fp4"] }
