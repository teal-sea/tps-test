# Example config: one model, reached three ways.
#
# One [[targets]] block = one upstream endpoint. To compare "the same model
# across providers", keep the *model* identical and change base_url (direct
# vendor) or the `provider.only` pin (gateway). Every row below is meant to be
# DeepSeek-V3.2; mixing versions turns a provider comparison into a model one.
#
# Generate the gateway blocks mechanically instead of typing them:
#   tps discover deepseek/deepseek-v3.2 --out targets.toml

[run]
reps = 7                # repetitions per (prompt, concurrency). 7 is a floor.
concurrency = [1, 4]    # 1 = single-stream latency; 4 = queueing behaviour
warmup = 2              # discarded requests per target (TLS + cold start)
temperature = 0.0
timeout_s = 180
prompts = ["prose-256", "code-256"]
# max_tokens_field = "max_tokens"   # use "max_completion_tokens" for o-series/GPT-5

# --- direct vendor endpoints -------------------------------------------------
# Vendors name the same weights differently. These ids are illustrative:
# confirm the exact V3.2 id in each account before trusting a row.

[[targets]]
name = "deepseek-direct"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"            # DeepSeek's alias for its current V3.x release
api_key_env = "DEEPSEEK_API_KEY"
price = { in_per_1m = 0.28, out_per_1m = 0.42 }

[[targets]]
name = "together-direct"
base_url = "https://api.together.xyz/v1"
model = "deepseek-ai/DeepSeek-V3.2"
api_key_env = "TOGETHER_API_KEY"

[[targets]]
name = "fireworks-direct"
base_url = "https://api.fireworks.ai/inference/v1"
model = "accounts/fireworks/models/deepseek-v3p2"
api_key_env = "FIREWORKS_API_KEY"

# --- gateway, pinned to one upstream ----------------------------------------
#
# Without `only` + `allow_fallbacks = false` you are measuring the router's
# choice, not the provider you think you are measuring. Pinning is the whole
# point of this file.

[[targets]]
name = "or-deepinfra"
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-v3.2"
api_key_env = "OPENROUTER_API_KEY"
extra_body.provider = { only = ["deepinfra"], allow_fallbacks = false, quantizations = ["fp4"] }
price = { in_per_1m = 0.26, out_per_1m = 0.38 }

[[targets]]
name = "or-gmicloud"
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-v3.2"
api_key_env = "OPENROUTER_API_KEY"
extra_body.provider = { only = ["gmicloud"], allow_fallbacks = false, quantizations = ["fp8"] }
price = { in_per_1m = 0.2088, out_per_1m = 0.3096 }

# --- the same gateway, left unpinned (for contrast) -------------------------
# No provider block: this row answers "what does the router give me by
# default". Check `served by` in the report to see where requests landed.

[[targets]]
name = "or-unpinned"
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-v3.2"
api_key_env = "OPENROUTER_API_KEY"
