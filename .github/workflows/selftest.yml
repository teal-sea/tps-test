name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # installing the package also exercises packaging: console script, deps
      - name: Install
        run: pip install ".[http2]"

      # selftest.py spins up a local SSE server and reads a recorded fixture:
      # no network egress, no API keys, so it runs fine on a public runner.
      - name: Self-test
        run: python tests/selftest.py

      - name: CLI smoke test
        run: |
          tps --version
          tps doctor --no-color || test $? -eq 2        # no keys in CI: 2 is expected
          tps run -c targets.mock.toml --mock --reps 2 --json > run.json
          jq -e '.ok == true and .mock == true and (.results | length) == 3' run.json
          jq -e '[.results[] | .out_tps_p90 <= .out_tps_p50] | all' run.json   # p90 = slow tail
          # removed commands stay removed: usage error, one JSON object, exit 1
          code=0; tps fingerprint --json > gone.json || code=$?; test "$code" -eq 1
          jq -e '.ok == false and .error.code == 1' gone.json
          # mock-only config refuses to run without --mock (exit 1, not fake data)
          code=0; tps run -c targets.mock.toml || code=$?; test "$code" -eq 1
          # bad flags exit 1 (never argparse's 2, which means "missing credentials")
          code=0; tps run --json --reps nope > bad.json || code=$?; test "$code" -eq 1
          jq -e '.ok == false and .error.code == 1' bad.json

  docs:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[docs]"
      # --strict turns broken internal links into a build failure
      - run: mkdocs build --strict
      # the wiki is generated from docs/; make sure every page maps
      - run: scripts/publish-wiki.sh --dry-run "$RUNNER_TEMP/wiki"
