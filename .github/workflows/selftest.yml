name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install "httpx[http2]"
      # selftest.py spins up a local SSE server and reads a recorded fixture:
      # no network egress, no API keys, so it runs fine on a public runner.
      - name: Run selftest
        run: python tests/selftest.py
