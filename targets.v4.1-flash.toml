# --- premium tier -------------------------------------------------------

[[targets]]
name = "baseten priority"
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-v4.1-flash"
api_key_env = "OPENROUTER_API_KEY"
extra_body.provider = { only = ["baseten/fast"], allow_fallbacks = false }
price = { in_per_1m = 0.600, out_per_1m = 2.400 }

# --- control ------------------------------------------------------------
# No provider block at all. This is what you actually get by default
# (price-weighted routing), and the row that tells you whether pinning is
# worth the effort. `served by` in the report shows where each request went.

[[targets]]
name = "openrouter auto"
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-v4.1-flash"
api_key_env = "OPENROUTER_API_KEY"

