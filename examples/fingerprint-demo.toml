# Offline fingerprint demo with fictional providers — no network, no keys.
#   tps fingerprint -c examples/fingerprint-demo.toml --mock
#
# `mock.family` picks a synthetic weight family: 0 = reference weights,
# 1 = same base model at another quantization (long shared prefix, then
# divergence), 2 = a different model (diverges early, tokenizes differently).
# `mock.noisy` makes an endpoint disagree with itself, like a router fanning
# requests out across backends.

[run]
prompts = ["prose-256"]

[[targets]]
name = "acme-ai (fp8)"
base_url = "http://localhost:0000"
model = "demo-model"
mock = { family = 0 }

[[targets]]
name = "globex (fp8)"
base_url = "http://localhost:0000"
model = "demo-model"
mock = { family = 0 }

[[targets]]
name = "hooli (fp8)"
base_url = "http://localhost:0000"
model = "demo-model"
mock = { family = 0 }

[[targets]]
name = "initech (fp4)"
base_url = "http://localhost:0000"
model = "demo-model"
mock = { family = 1 }

[[targets]]
name = "vandelay (fp4)"
base_url = "http://localhost:0000"
model = "demo-model"
mock = { family = 1 }

[[targets]]
name = "wonka (unlisted)"
base_url = "http://localhost:0000"
model = "demo-model"
mock = { family = 2 }

[[targets]]
name = "gateway-auto"
base_url = "http://localhost:0000"
model = "demo-model"
mock = { family = 0, noisy = true }
