# Gateway comparison — a gateway is just a base_url.
#
# Three different questions, three different row pairs:
#
#   1. WHAT DOES THE HOP COST?      same upstream, direct vs through the gateway
#      Answer: (or-throughput) - (together-direct)
#      Requires the vendor to be reachable BOTH ways. If it isn't, you are
#      measuring hop overhead + a different upstream + different routing, and
#      no amount of careful reading will separate them.
#
#   2. WHAT DOES THE ROUTER'S CHOICE COST ME?   unpinned vs your best pin
#      Answer: (or-unpinned-price) - (or-pinned-together)
#
#   3. IS THE GATEWAY ITSELF THE BOTTLENECK?    one gateway vs another
#      Add a second gateway block below, same model, same pins.
#
# Run with the baseline set (see [run]) to get Δ columns instead of eyeballing:
#   tps run -c targets.gateway.toml

[run]
reps = 7
concurrency = [1, 4]
warmup = 2
temperature = 0.0
timeout_s = 180
prompts = ["prose-256"]
# set this to the direct row once you know the vendor's model id; until then
# the deltas are versus the pinned gateway row, which is still useful
baseline = "or-pinned-together"

# --- 1. gateway, pinned to one upstream ------------------------------------

[[targets]]
name = "or-pinned-together"
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-v4.1-flash"
api_key_env = "OPENROUTER_API_KEY"
extra_body.provider = { only = ["together"], allow_fallbacks = false }
price = { in_per_1m = 0.300, out_per_1m = 1.200 }

# --- 2. the router choosing for you ---------------------------------------

[[targets]]
name = "or-unpinned-price"
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-v4.1-flash"
api_key_env = "OPENROUTER_API_KEY"
# no provider block = default price-weighted load balancing

[[targets]]
name = "or-unpinned-throughput"
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-v4.1-flash"
api_key_env = "OPENROUTER_API_KEY"
extra_body.provider = { sort = "throughput" }

# --- 1b. the direct baseline ----------------------------------------------
# Fireworks runs DeepSeek weights and is also an OpenRouter provider for this
# model, which makes it the cleanest same-upstream pair. Confirm the exact
# model id in your Fireworks account — assertions here are config, not truth.

